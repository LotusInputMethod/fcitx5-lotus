name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format

  check-glibc:
    name: Build and test (glibc)
    runs-on: ubuntu-latest
    container: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules libuv git libei libinput libevdev systemd-libs python
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key:
            ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      - uses: actions/checkout@v7
        with:
          path: fcitx5-lotus
      - name: Init CodeQL
        if: matrix.compiler == 'gcc'
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: cpp
          source-root: fcitx5-lotus
      - name: Build and Install fcitx5-lotus
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lotus
          cmake-option: -DBUILD_TESTING=ON
      - name: Discover tests
        run: |
          ctest --test-dir fcitx5-lotus/build -N
      - name: Test
        run: |
          ctest --test-dir fcitx5-lotus/build --output-on-failure --no-tests=error
      - name: CodeQL Analysis
        if: matrix.compiler == 'gcc'
        uses: github/codeql-action/analyze@v4.38.3
        with:
          checkout_path: fcitx5-lotus

  check-musl:
    name: Build and test (musl)
    runs-on: ubuntu-latest
    container: alpine:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base cmake ninja extra-cmake-modules libuv-dev git libinput-dev libevdev-dev python3 zlib-dev gettext-dev util-linux-dev tar clang
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt') }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          shell: sh
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      - uses: actions/checkout@v7
        with:
          path: fcitx5-lotus
      - name: Build and Install fcitx5-lotus
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lotus
          shell: sh
          cmake-option: -DBUILD_TESTING=ON
      - name: Discover tests
        run: |
          ctest --test-dir fcitx5-lotus/build -N
      - name: Test
        run: |
          ctest --test-dir fcitx5-lotus/build --output-on-failure --no-tests=error

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings-gui'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings-gui'
