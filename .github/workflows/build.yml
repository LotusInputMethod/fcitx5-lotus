name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format

  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git go libinput systemd-libs extra-cmake-modules libx11 python librsvg
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key:
            ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      - uses: actions/checkout@v7
        with:
          path: fcitx5-lotus
          submodules: true
      - name: Init CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: cpp,go
          source-root: fcitx5-lotus
      - name: Build and Install fcitx5-lotus
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lotus
          # Enable building the headless integration test suite alongside the addon
          cmake-option: -DBUILD_TESTING=ON
      # Log all discovered CTest targets in job output for quick triage and auditability
      - name: Discover tests
        run: |
          ctest --test-dir fcitx5-lotus/build -N
      # Execute test suite:
      # - --output-on-failure: dumps stdout/stderr immediately if an assertion fails
      # - --no-tests=error: ensures CI fails if test discovery yielded 0 tests (prevents false-positive passing builds)
      - name: Test
        run: |
          ctest --test-dir fcitx5-lotus/build --output-on-failure --no-tests=error
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          checkout_path: fcitx5-lotus

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    needs: clang-format
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.18'
      - name: Test
        working-directory: bamboo
        run: go test -race ./...
      - name: Vet
        working-directory: bamboo
        run: go vet ./...
      - name: gofmt
        working-directory: bamboo
        run: |
          test -z "$(gofmt -l *_test.go)"

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    needs: clang-format
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint and Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings-gui'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings-gui'
