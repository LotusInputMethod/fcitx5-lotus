name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format
  build:
    name: Build and test
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        distro: [glibc, musl]
        compiler: [gcc, clang]
        include:
          - distro: glibc
            compiler: gcc
            container: archlinux:latest
            install: arch
            shell: bash
            cxx_compiler: g++
          - distro: glibc
            compiler: clang
            container: archlinux:latest
            install: arch
            shell: bash
            cxx_compiler: clang++
          - distro: musl
            compiler: gcc
            container: alpine:latest
            install: alpine
            shell: sh
            cxx_compiler: g++
          - distro: musl
            compiler: clang
            container: alpine:latest
            install: alpine
            shell: sh
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies (glibc)
        if: matrix.install == 'arch'
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules libuv git libinput libevdev libnotify dbus systemd-libs python
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - name: Install dependencies (musl)
        if: matrix.install == 'alpine'
        run: |
          apk add --no-cache build-base cmake ninja extra-cmake-modules libuv-dev git libinput-dev libevdev-dev libnotify-dev dbus-dev python3 zlib-dev gettext-dev util-linux-dev tar clang linux-headers
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt') }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          shell: ${{ matrix.shell }}
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      - uses: actions/checkout@v7
        with:
          path: fcitx5-lotus
          fetch-depth: 0
      - name: Init CodeQL
        if: matrix.distro == 'glibc' && matrix.compiler == 'gcc'
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: cpp
          source-root: fcitx5-lotus
      - name: Build and Install fcitx5-lotus
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lotus
          shell: ${{ matrix.shell }}
          cmake-option: -DBUILD_TESTING=ON
      - name: Discover tests
        run: |
          ctest --test-dir fcitx5-lotus/build -N
      - name: Test
        run: |
          ctest --test-dir fcitx5-lotus/build --output-on-failure --no-tests=error
      - name: Check clang-tidy
        if: matrix.distro == 'glibc' && matrix.compiler == 'clang'
        run: |
          cd fcitx5-lotus
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
              changed="$(git diff --name-only "$base" HEAD)"
          else
              echo "clang-tidy: base '${base:-<empty>}' is not available locally, checking everything"
              changed=""
          fi
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qE '\.(h|hpp)$'; then
              echo "clang-tidy: checking the whole project"
              run-clang-tidy -p build -j "$(nproc)" -quiet -warnings-as-errors='*'
          else
              cpp_changed="$(printf '%s\n' "$changed" | grep -E '\.cpp$' || true)"
              if [ -n "$cpp_changed" ]; then
                  echo "clang-tidy: checking the changed translation units"
                  printf '%s\n' "$cpp_changed" | xargs run-clang-tidy -p build -j "$(nproc)" -quiet -warnings-as-errors='*'
              else
                  echo "clang-tidy: no translation unit changed"
              fi
          fi
      - name: CodeQL Analysis
        if: matrix.distro == 'glibc' && matrix.compiler == 'gcc'
        uses: github/codeql-action/analyze@v4.39.1
        with:
          checkout_path: fcitx5-lotus

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings-gui test/settings-gui'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings-gui test/settings-gui'
