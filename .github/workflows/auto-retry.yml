name: Auto Retry Failed Builds

on:
  workflow_run:
    workflows:
      ['CI', 'Test Packaging Build', 'Test Packaging Build', 'Build & Release']
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Retry Failed Matrix
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rerun for failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Attempt ${{ github.event.workflow_run.run_attempt }} failed. Retrying failed jobs..."
          gh run rerun ${{ github.event.workflow_run.id }} --failed
