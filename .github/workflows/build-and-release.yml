name: Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: DEB [${{ matrix.codename }}]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            codename: bookworm
          - distro: debian:13
            codename: trixie
          - distro: debian:testing
            codename: forky
          - distro: debian:unstable
            codename: sid
          - distro: ubuntu:22.04
            codename: jammy
          - distro: ubuntu:24.04
            codename: noble
          - distro: ubuntu:25.10
            codename: questing
          - distro: ubuntu:26.04
            codename: resolute

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    env:
      DEBIAN_FRONTEND: noninteractive
      CODENAME: ${{ matrix.codename }}

    steps:
      - name: Install git and base tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git build-essential

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare debian directory
        run: cp -r packaging/debian debian

      - name: Install build dependencies
        run: apt-get build-dep -y --no-install-recommends .

      - name: Build DEB
        run: |
          set -euo pipefail
          dpkg-buildpackage --build=binary --no-sign

      - name: Collect DEB artifacts
        run: |
          set -euo pipefail
          mkdir -p debian/artifacts
          mv ../*.deb debian/artifacts/

      - name: Rename DEB artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for f in debian/artifacts/*.deb; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .deb)
            mv "$f" "debian/artifacts/${base}_${CODENAME}.deb"
          done

      - name: Create APT Repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          apt-get install -y -qq --no-install-recommends reprepro gnupg2

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          gpg-connect-agent reloadagent /bye || true

          codename="$CODENAME"
          case "$codename" in
            sid)      suite="unstable" ;;
            testing)  suite="testing"  ;;
            *)        suite="stable"   ;;
          esac

          mkdir -p "repo/apt/${codename}/conf"
          cat > "repo/apt/${codename}/conf/distributions" << EOF
          Codename: ${codename}
          Suite: ${suite}
          Components: main
          Architectures: amd64
          SignWith: ${FINGERPRINT}
          EOF

          for deb in debian/artifacts/*.deb; do
            [ -f "$deb" ] || continue
            reprepro --gnupghome ~/.gnupg -b "repo/apt/${codename}" includedeb "$codename" "$deb"
          done

          gpg --batch --yes --delete-secret-and-public-key "${FINGERPRINT}" || true

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.codename }}
          path: debian/artifacts/*.deb
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}

      - name: Upload APT Repo artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: repo-apt-${{ matrix.codename }}
          path: repo/
          retention-days: 1

  build-rpm-fedora:
    name: RPM [fedora-${{ matrix.releasever }}]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:43
            releasever: 43
          - distro: fedora:44
            releasever: 44
          - distro: fedora:rawhide
            releasever: rawhide

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    env:
      RELEASEVER: ${{ matrix.releasever }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Install git
        run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Fedora RPM
        run: |
          set -euo pipefail
          find /etc/yum.repos.d -name '*openh264*' -type f -delete 2>/dev/null || true
          dnf clean all
          dnf install -y --setopt=install_weak_deps=False rpm-build rpmdevtools dnf-plugins-core
          rpmdev-setuptree
          cp packaging/rpm/fedora/fcitx5-lotus.spec ~/rpmbuild/SPECS/
          dnf builddep --setopt=install_weak_deps=False -y ~/rpmbuild/SPECS/fcitx5-lotus.spec
          mkdir -p ~/rpmbuild/SOURCES
          VERSION=$(grep '^Version:' packaging/rpm/fedora/fcitx5-lotus.spec | awk '{print $2}')
          tar --exclude='.git' \
              --exclude='packaging' \
              --transform "s|^\.|fcitx5-lotus-${VERSION}|" \
              -czf ~/rpmbuild/SOURCES/fcitx5-lotus-${VERSION}.tar.gz .
          rpmbuild -bb ~/rpmbuild/SPECS/fcitx5-lotus.spec
          mkdir -p output
          if [ "$IS_TAG" = "true" ]; then
            find ~/rpmbuild/RPMS -name '*.rpm' -type f | while read -r rpm; do
              base=$(basename "$rpm" .rpm)
              mv "$rpm" "output/${base}.${RELEASEVER}.rpm"
            done
          else
            find ~/rpmbuild/RPMS -name '*.rpm' -type f -exec cp {} output/ \;
          fi

      - name: Sign RPM packages and Create Repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False createrepo_c gnupg2 rpm-sign

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg-connect-agent reloadagent /bye || true

          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)

          cat > ~/.rpmmacros << EOF
          %_gpg_name ${KEYID}
          %__gpg_sign_cmd %{__gpg} gpg \
            --no-verbose --no-armor --batch \
            --pinentry-mode loopback \
            -u "%{_gpg_name}" \
            -sbo %{__signature_filename} \
            %{__plaintext_filename}
          EOF

          for rpm in output/*.rpm; do
            rpmsign --addsign "$rpm"
          done

          releasever="$RELEASEVER"
          dir="repo/rpm/fedora/${releasever}/x86_64"
          mkdir -p "$dir"

          for rpm in output/*.rpm; do
            [ -f "$rpm" ] || continue
            [[ "$rpm" == *debug* ]] && continue
            cp "$rpm" "$dir/"
          done

          if [ "$(ls -A $dir)" ]; then
            createrepo_c "$dir"
            gpg --batch --yes --detach-sign --armor "$dir/repodata/repomd.xml"
          fi

          mkdir -p repo/rpm/fedora
          cat > "repo/rpm/fedora/fcitx5-lotus-${releasever}.repo" << EOF
          [fcitx5-lotus]
          name=fcitx5-lotus — Fedora ${releasever}
          baseurl=https://fcitx5-lotus.pages.dev/rpm/fedora/${releasever}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://fcitx5-lotus.pages.dev/pubkey.gpg
          EOF

          gpg --batch --yes --delete-secret-and-public-key "$KEYID" || true

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-fedora-${{ matrix.releasever }}
          path: output/*.rpm
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}

      - name: Upload Fedora Repo artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: repo-rpm-fedora-${{ matrix.releasever }}
          path: repo/
          retention-days: 1

  build-rpm-opensuse:
    name: RPM [opensuse-${{ matrix.releasever }}]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse/tumbleweed
            releasever: tumbleweed

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    env:
      RELEASEVER: ${{ matrix.releasever }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Install git
        run: zypper install -y --no-recommends git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build openSUSE RPM
        run: |
          set -euo pipefail
          zypper --non-interactive remove -y busybox-gawk || true
          zypper install -y --force-resolution --no-recommends gawk rpm-build rpmdevtools
          rpmdev-setuptree
          cp packaging/rpm/opensuse/fcitx5-lotus.spec ~/rpmbuild/SPECS/
          zypper -n install --no-recommends \
            $(rpmspec -P ~/rpmbuild/SPECS/fcitx5-lotus.spec \
              | grep '^BuildRequires:' \
              | awk '{print $2}' \
              | xargs)
          mkdir -p ~/rpmbuild/SOURCES
          VERSION=$(grep '^Version:' packaging/rpm/opensuse/fcitx5-lotus.spec | awk '{print $2}')
          tar --exclude='.git' \
              --exclude='packaging' \
              --transform "s|^\.|fcitx5-lotus-${VERSION}|" \
              -czf ~/rpmbuild/SOURCES/fcitx5-lotus-${VERSION}.tar.gz .
          rpmbuild -bb ~/rpmbuild/SPECS/fcitx5-lotus.spec
          mkdir -p output
          if [ "$IS_TAG" = "true" ]; then
            find ~/rpmbuild/RPMS -name '*.rpm' -type f | while read -r rpm; do
              base=$(basename "$rpm" .rpm)
              mv "$rpm" "output/${base}.${RELEASEVER}.rpm"
            done
          else
            find ~/rpmbuild/RPMS -name '*.rpm' -type f -exec cp {} output/ \;
          fi

      - name: Sign RPM packages and Create Repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          zypper install -y --no-recommends createrepo_c gnupg2

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg-connect-agent reloadagent /bye || true

          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)

          cat > ~/.rpmmacros << EOF
          %_gpg_name ${KEYID}
          %__gpg_sign_cmd %{__gpg} gpg \
            --no-verbose --no-armor --batch \
            --pinentry-mode loopback \
            -u "%{_gpg_name}" \
            -sbo %{__signature_filename} \
            %{__plaintext_filename}
          EOF

          if command -v rpmsign >/dev/null 2>&1; then
            RPMSIGN=rpmsign
          else
            RPMSIGN=rpm
          fi
          for rpm in output/*.rpm; do
            "$RPMSIGN" --addsign "$rpm"
          done

          releasever="$RELEASEVER"
          dir="repo/rpm/opensuse/${releasever}/x86_64"
          mkdir -p "$dir"

          for rpm in output/*.rpm; do
            [ -f "$rpm" ] || continue
            [[ "$rpm" == *debug* ]] && continue
            cp "$rpm" "$dir/"
          done

          if [ "$(ls -A $dir)" ]; then
            createrepo_c "$dir"
            gpg --batch --yes --detach-sign --armor "$dir/repodata/repomd.xml"
          fi

          mkdir -p repo/rpm/opensuse
          cat > "repo/rpm/opensuse/fcitx5-lotus-${releasever}.repo" << EOF
          [fcitx5-lotus]
          name=fcitx5-lotus — openSUSE ${releasever}
          baseurl=https://fcitx5-lotus.pages.dev/rpm/opensuse/${releasever}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://fcitx5-lotus.pages.dev/pubkey.gpg
          EOF

          gpg --batch --yes --delete-secret-and-public-key "$KEYID" || true

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-opensuse-${{ matrix.releasever }}
          path: output/*.rpm
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}

      - name: Upload openSUSE Repo artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: repo-rpm-opensuse-${{ matrix.releasever }}
          path: repo/
          retention-days: 1

  build-arch:
    name: Arch Linux (zstd)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build on Arch Linux
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm \
            cmake extra-cmake-modules gcc go \
            fcitx5 libinput systemd python \
            make pkgconf zstd

          export LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs"
          export CGO_LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs"
          cmake \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=/usr/lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
            -DINSTALL_OPENRC=ON \
            -DINSTALL_RUNIT=ON \
            -DRUNIT_SV_DIR=/etc/runit/sv \
            -DBUILD_TESTING=ON \
            -B build .
          cmake --build build
          ctest --test-dir build --output-on-failure
          DESTDIR="$PWD/arch-dist" cmake --install build
          find arch-dist/usr/bin -type f \
            -exec strip --strip-all {} + 2>/dev/null || true
          find arch-dist/usr/lib -name "*.so*" -type f \
            -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Package as tar.zst
        env:
          RAW_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION//\//-}"
          tar -c -I 'zstd -19 -T0' -f "fcitx5-lotus-${VERSION}-x86_64-archlinux.tar.zst" -C arch-dist .

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-tar-zst
          path: fcitx5-lotus-*-x86_64-archlinux.tar.zst
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm-fedora, build-rpm-opensuse, build-arch]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: '{deb-*,rpm-*,arch-tar-zst}'
          path: artifacts/
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.zst

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.zst' \) -print0
          )
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::No release assets found"; exit 1; }
          echo "Uploading ${#assets[@]} assets to release ${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${assets[@]}"

  deploy:
    name: Deploy to Cloudflare Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all repo artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: downloaded-repos/

      - name: Merge Repos
        run: |
          set -euo pipefail
          mkdir -p repo
          for d in downloaded-repos/repo-*/; do
            if [ -d "$d" ]; then
              cp -a "$d". repo/
            fi
          done

      - name: Copy public key
        run: cp packaging/pubkey.gpg repo/pubkey.gpg

      - name: Generate index pages
        uses: gacts/directory-listing@v1
        with:
          target: repo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy repo --project-name=fcitx5-lotus --branch=main --commit-dirty=true